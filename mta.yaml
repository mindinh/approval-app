_schema-version: "3.3.0"
ID: cnma_prorequest_s4h
version: 1.0.0
description: "My Approval - Workflow task management and approvals"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx -p @sap/cds-dk cds build --production

# ═══════════════════════════════════════════════════════════════════════════════
#                              MODULES
# ═══════════════════════════════════════════════════════════════════════════════

modules:
  # ─────────────────────────────────────────────────────────────────────────────
  # CAP Backend Server
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    properties:
      SAP_USE_DESTINATION: "true"
      SAP_TASK_DESTINATION: "VJ_DS4"
      SAP_TASK_CLIENT: "300"
      USE_MOCK_SAP: "false"
      SAP_LAUNCHPAD_BASE_URL: "https://proconarum-vj-qas.launchpad.cfapps.ap11.hana.ondemand.com/site?siteId=4dc3f27d-2323-459c-8470-058fe64e8ca2"
      SAP_PR_APP_ID_HINT: "2079f675-98bf-427c-a523-05b63006c5f1"
      SAP_PR_INTENT_PATTERN: "#F2229-Display?sap-ushell-config=headerless&sap-ui-app-id-hint={appIdHint}&/C_PurchaseReqnHeader(PurchaseRequisition='{prNumber}',DraftUUID=guid'00000000-0000-0000-0000-000000000000',IsActiveEntity=true)"
    build-parameters:
      builder: npm
      ignore:
        - "node_modules/"
    requires:
      - name: cnma-prorequest-s4h-auth
      - name: cnma-prorequest-s4h-identity
      - name: cnma-prorequest-s4h-destination
      - name: cnma-prorequest-s4h-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ─────────────────────────────────────────────────────────────────────────────
  # Standalone App Router (Direct URL access)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    properties:
      DYNAMIC_IDENTITY_PROVIDER: true
    requires:
      - name: cnma-prorequest-s4h-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 300000
    build-parameters:
      ignore:
        - "node_modules/"
      requires:
        - name: cnma-prorequest-s4h-ui
          artifacts:
            - ./*
          target-path: resources/cnma
  # ─────────────────────────────────────────────────────────────────────────────
  # React Frontend UI Build
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-ui
    type: html5
    path: app/cnma_approval_ui
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
      build-result: dist

  # ─────────────────────────────────────────────────────────────────────────────
  # UI Deployer (pushes UI zip to HTML5 App Repo for WorkZone)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: cnma-prorequest-s4h-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      memory: 128M
      disk-quota: 256M
      ignore:
        - "*node_modules*"
        - "node_modules/"
        - "mta_archives/"
        - "gen/"
        - "*.db"
        - "tests/"
        - ".git/"
        - ".github/"
        - ".agent/"
        - ".agents/"
        - "app/cnma_approval_ui/"
        - "app/router/"
        - "srv/"
        - "db/"
      build-result: ui_resources
      requires:
        - name: cnma-prorequest-s4h-ui
          artifacts:
            - cnma_approval_ui.zip
          target-path: ui_resources/

  # ─────────────────────────────────────────────────────────────────────────────
  # Destination Content Registry (for WorkZone managed app router)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-destination-content
    type: com.sap.application.content
    requires:
      - name: srv-api
      - name: cnma-prorequest-s4h-destination
        parameters:
          content-target: true
      - name: cnma-prorequest-s4h-auth
        parameters:
          service-key:
            name: cnma-prorequest-s4h-auth-key
      - name: cnma-prorequest-s4h-html5-repo-host
        parameters:
          service-key:
            name: cnma-prorequest-s4h-html5-repo-host-key

    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            # XSUAA Destination
            - Name: cnma_prorequest_s4h_xsuaa_dest
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cnma-prorequest-s4h-auth
              ServiceKeyName: cnma-prorequest-s4h-auth-key
              sap.cloud.service: cnma_prorequest_s4h
            # Html5 Repo Destination
            - Name: cnma_prorequest_s4h_html5_repo_host_dest
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cnma-prorequest-s4h-html5-repo-host
              ServiceKeyName: cnma-prorequest-s4h-html5-repo-host-key
              sap.cloud.service: cnma_prorequest_s4h

# ═══════════════════════════════════════════════════════════════════════════════
#                              RESOURCES
# ═══════════════════════════════════════════════════════════════════════════════

resources:
  # ─────────────────────────────────────────────────────────────────────────────
  # XSUAA (Authentication & Authorization)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Destination Service (for SAP backend + WorkZone routing)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        version: 1.0.0
        forwardAuthToken: true
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: cnma_prorequest_s4h_destination
                Description: CNMA ProRequest S4H Service Destination
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                HTML5.Timeout: 600000

  # ─────────────────────────────────────────────────────────────────────────────
  # Connectivity Service (for on-premise destinations via Cloud Connector)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # ─────────────────────────────────────────────────────────────────────────────
  # Identity Service (for mobile IAS OIDC support)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-identity
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-plan: application
      config:
        xsuaa-cross-consumption: true
        display-name: CNMA ProRequest S4H Identity

  # ─────────────────────────────────────────────────────────────────────────────
  # HTML5 Application Repository Host
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ─────────────────────────────────────────────────────────────────────────────
  # HTML5 Application Repository Runtime
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cnma-prorequest-s4h-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
